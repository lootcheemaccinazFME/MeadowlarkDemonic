name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
        working-directory: android-app
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
        working-directory: android-app
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: android-app
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
        working-directory: android-app
      - name: Validate APKs
        run: test -s app/build/outputs/apk/debug/app-debug.apk && test -s app/build/outputs/apk/release/app-release-unsigned.apk
        working-directory: android-app
      - uses: actions/upload-artifact@v4
        with:
          name: MeadowlarkDemonic-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
