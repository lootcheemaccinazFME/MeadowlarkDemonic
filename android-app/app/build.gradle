plugins { id 'com.android.application' }

android {
 namespace 'com.flymaccin.meadowlarkdemonic'
 compileSdk 35
 defaultConfig { applicationId 'com.flymaccin.meadowlarkdemonic'; minSdk 26; targetSdk 35; versionCode 101; versionName '1.0.0-rc2' }

 signingConfigs {
  release {
   def storePath=System.getenv('FME_KEYSTORE_PATH')
   if(storePath){ storeFile file(storePath); storePassword System.getenv('FME_KEYSTORE_PASSWORD'); keyAlias System.getenv('FME_KEY_ALIAS'); keyPassword System.getenv('FME_KEY_PASSWORD') }
  }
 }
 buildTypes {
  debug { debuggable true }
  release {
   minifyEnabled false
   if(System.getenv('FME_KEYSTORE_PATH')) signingConfig signingConfigs.release
  }
 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
